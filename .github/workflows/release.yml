name: Release

# Builds torpor-muse for the engine's four platforms, attests the assets, proves the README install block on a bare
# machine, and (tags only) publishes the GitHub Release.
#   push of a tag v*         every job; the last one creates the Release
#   push to branch release-ci  the test path: every job except the Release (never fires on main)
# Every third-party action is pinned by commit SHA; the tag is in the comment.

on:
  push:
    tags: ['v*']
    branches: [release-ci]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  CARGO_TERM_COLOR: always
  # ring compiles C and assembly; musl-gcc (musl-tools) is its compiler for the static Linux targets.
  CC_x86_64_unknown_linux_musl: musl-gcc
  CC_aarch64_unknown_linux_musl: musl-gcc

jobs:
  build:
    name: Build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, target: x86_64-unknown-linux-musl, os: ubuntu-latest }
          - { platform: linux-arm64, target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm }
          - { platform: darwin-arm64, target: aarch64-apple-darwin, os: macos-latest }
          - { platform: darwin-x64, target: x86_64-apple-darwin, os: macos-latest }
    runs-on: ${{ matrix.os }}
    env:
      PLATFORM: ${{ matrix.platform }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: musl tools
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq musl-tools file
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --target "$TARGET" && rustup default stable
      - name: Release build
        run: cargo build --release --locked --target "$TARGET"
      - name: Asset torpor-muse-${{ matrix.platform }}
        run: |
          mkdir dist
          cp "target/$TARGET/release/torpor-muse" "dist/torpor-muse-$PLATFORM"
          chmod 755 "dist/torpor-muse-$PLATFORM"
          file "dist/torpor-muse-$PLATFORM"
      - name: The Linux asset is static
        if: runner.os == 'Linux'
        run: |
          f="dist/torpor-muse-$PLATFORM"
          file "$f" | grep -Eq 'statically linked|static-pie linked' || { echo "FAIL: $f is not static"; exit 1; }
          if readelf -lW "$f" | grep -q INTERP; then echo "FAIL: $f asks for a dynamic loader"; exit 1; fi
      - name: The macOS asset has its architecture
        if: runner.os == 'macOS'
        run: |
          case "$PLATFORM" in darwin-arm64) arch_word=arm64 ;; darwin-x64) arch_word=x86_64 ;; esac
          file "dist/torpor-muse-$PLATFORM" | grep -q "Mach-O 64-bit executable $arch_word"
      - name: The asset runs and prints the Cargo.toml version
        run: |
          f="dist/torpor-muse-$PLATFORM"
          want="torpor-muse $(awk -F'"' '$1 == "version = " { print $2; exit }' Cargo.toml)"
          if [ "$PLATFORM" = darwin-x64 ]; then
            # the macOS runner is Apple silicon: the Intel build runs only if Rosetta is there
            if arch -x86_64 /usr/bin/true 2>/dev/null; then got=$(arch -x86_64 "$f" version); else echo "darwin-x64: built, not run (no Rosetta here)"; exit 0; fi
          else
            got=$("$f" version)
          fi
          echo "$f prints: $got"
          [ "$got" = "$want" ] || { echo "FAIL: expected $want"; exit 1; }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.platform }}
          path: dist/torpor-muse-${{ matrix.platform }}
          if-no-files-found: error

  # One flat artifact, release-assets: the four binaries and SHA256SUMS (bare file names, so `sha256sum -c` works in
  # the directory it is unpacked to). The attestation, the clean rooms and the Release all use this one set.
  assemble:
    name: SHA256SUMS
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist
      - name: Four binaries, one SHA256SUMS
        run: |
          cd dist
          for p in linux-x64 linux-arm64 darwin-x64 darwin-arm64; do test -f "torpor-muse-$p"; done
          test "$(ls | wc -l)" -eq 4
          sha256sum torpor-muse-* > SHA256SUMS
          cat SHA256SUMS
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error

  attest:
    name: Attest build provenance
    needs: assemble
    runs-on: ubuntu-latest
    # The only job with id-token and attestations; the others get contents: read (the Release job: write, see below).
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*

  # The README install block on a machine that has nothing: scripts/cleanroom.sh runs it as written (only the release
  # base URL points at this run's release-assets) and then the offline first run. Every entry sets EXPECT_PLATFORM, and
  # the script fails unless the block installed exactly that platform's asset and HOME is as before init, so each
  # platform is proven on its own kind of machine and none can pass as another.
  #   Linux: a pristine Debian container (the block itself installs curl and ca-certificates), on x64 and on arm64.
  #   macOS: a fresh empty HOME on the runner, a CI replay: Apple silicon native, and the Intel build under Rosetta.
  clean-room-linux:
    name: Clean room (${{ matrix.platform }})
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux-x64, os: ubuntu-latest }
          - { platform: linux-arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    container: debian:stable-slim
    env:
      EXPECT_PLATFORM: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - run: sh scripts/cleanroom.sh dist

  clean-room-macos:
    name: Clean room (${{ matrix.platform }})
    needs: assemble
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: darwin-arm64, shell: /bin/sh }
          - { platform: darwin-x64, shell: arch -x86_64 /bin/sh } # uname -m is x86_64 in there: the block picks darwin-x64
    runs-on: macos-latest
    env:
      EXPECT_PLATFORM: ${{ matrix.platform }}
      CLEANROOM_SH: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Rosetta is here (the Intel build runs on this Apple silicon runner only through it)
        if: matrix.platform == 'darwin-x64'
        run: |
          [ "$(arch -x86_64 /usr/bin/uname -m)" = x86_64 ] ||
            { echo "FAIL: no Rosetta on this runner ('arch -x86_64 /usr/bin/uname -m' did not print x86_64), so the Intel build cannot be proven here"; exit 1; }
      - run: $CLEANROOM_SH scripts/cleanroom.sh dist

  release:
    name: GitHub Release
    if: github.ref_type == 'tag'
    needs: [attest, clean-room-linux, clean-room-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write # creating a Release needs it; this is the one job above contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Create the Release with the assets and SHA256SUMS
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd dist && sha256sum -c SHA256SUMS)
          gh release create "$GITHUB_REF_NAME" dist/* -R "$GITHUB_REPOSITORY" --verify-tag --title "torpor-muse $GITHUB_REF_NAME" \
            --notes "Install: the Install section of the README. Check the build: gh attestation verify <file> -R $GITHUB_REPOSITORY"
