name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scripts/new-work.sh reads the whole history
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - name: The engine tag still points at the pinned commit
        run: sh scripts/verify-engine.sh --tag
      - name: Only event work in this repo
        if: runner.os == 'Linux'
        run: sh scripts/new-work.sh
      - name: Pinned Torpor engine (engine.lock)
        run: sh scripts/fetch-engine.sh && echo "TORPOR_BIN=$PWD/.engine/torpor" >> "$GITHUB_ENV"
      - name: Format
        run: cargo fmt --check
      - name: Lints
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Mock API self-tests
        run: node --test mock/test/*.test.mjs
      - name: Eval task bank self-test
        run: node eval/selftest.mjs
      - name: Drill self-tests (builders, oracles, harness)
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sh drill/workspaces/selftest.sh
            node drill/oracles/selftest.mjs
            node drill/harness/selftest.mjs
          else
            echo "SKIP drill self-tests: Linux only"
          fi

  linux-musl:
    name: Linux (musl, static)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain and musl tools
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-unknown-linux-musl
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Release build
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: cargo build --release --target x86_64-unknown-linux-musl
